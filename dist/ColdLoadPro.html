<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ColdLoad Pro</title>
  <meta name="description" content="Company-neutral industrial refrigeration heat-load engineering application: projects, revisions, calculations, machinery-room ventilation and reports.">
  <meta name="application-name" content="ColdLoad Pro">
  <style>
/* ColdLoad Pro v2 — design system */
:root {
  --bg: #f2f4f7; --panel: #ffffff; --panel-2: #f7f8fa; --panel-3: #eef1f5; --line: #dfe3ea; --line-2: #c9d0da;
  --text: #17202c; --text-2: #3b4656; --muted: #687385;
  --brand: #0e5a8a; --brand-2: #0b4a72; --brand-soft: #e3eef6; --brand-ink: #ffffff;
  --accent: #0f8b8d; --ok: #1d7f4e; --ok-soft: #e1f3e9; --warn: #a15c00; --warn-soft: #fdf1dc; --err: #b42335; --err-soft: #fbe5e8; --info: #2f5fb3; --info-soft: #e5edfb;
  --cold: #2962c8; --cool: #0f8b8d;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18);
  --r: 8px; --r-sm: 6px;
  --c1: #2d6cdf; --c2: #0f8b8d; --c3: #6fb8a8; --c4: #7aa83a; --c5: #d97a1e; --c6: #e6ab52; --c7: #8c62d3; --c8: #b891ea; --c9: #cf4764; --c10: #e38da0; --c11: #677486; --c12: #9aabbf;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --panel: #151c25; --panel-2: #1a222d; --panel-3: #202a36; --line: #2a3542; --line-2: #3a4757;
    --text: #e6ebf1; --text-2: #c3ccd7; --muted: #8e9aab; --brand: #4a9ee0; --brand-2: #6db3ea; --brand-soft: #172a3c; --brand-ink: #06121d;
    --accent: #3cc2c4; --ok: #4cc38a; --ok-soft: #13301f; --warn: #f0b252; --warn-soft: #34270f; --err: #f27185; --err-soft: #3a1820; --info: #7fa6f0; --info-soft: #182440;
    --cold: #6f9dff; --cool: #3cc2c4; --shadow: none; --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151c25; --panel-2: #1a222d; --panel-3: #202a36; --line: #2a3542; --line-2: #3a4757;
  --text: #e6ebf1; --text-2: #c3ccd7; --muted: #8e9aab; --brand: #4a9ee0; --brand-2: #6db3ea; --brand-soft: #172a3c; --brand-ink: #06121d;
  --accent: #3cc2c4; --ok: #4cc38a; --ok-soft: #13301f; --warn: #f0b252; --warn-soft: #34270f; --err: #f27185; --err-soft: #3a1820; --info: #7fa6f0; --info-soft: #182440;
  --cold: #6f9dff; --cool: #3cc2c4; --shadow: none; --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.2px; }
h2 { font-size: 18px; margin: 0; font-weight: 650; }
h3 { font-size: 15px; margin: 0; font-weight: 650; }
h4 { font-size: 13.5px; margin: 14px 0 8px; font-weight: 650; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .strong { font-weight: 700; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.pad { padding: 10px 12px; margin: 0; }
.ic { flex: none; }
hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); border-radius: var(--r-sm); padding: 7px 13px; font-weight: 600; cursor: pointer; white-space: nowrap; line-height: 1.2; }
.btn:hover:not(:disabled) { background: var(--panel-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover:not(:disabled) { background: var(--brand-2); }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.ghost-danger { color: var(--err); border-color: transparent; background: transparent; }
.btn.ghost-danger:hover:not(:disabled) { background: var(--err-soft); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.block { width: 100%; justify-content: center; padding: 10px; }
.btn.bar { border: 0; background: transparent; padding: 6px 9px; color: var(--text-2); }
.btn.bar:hover:not(:disabled) { background: var(--panel-3); color: var(--text); }
.barlbl { display: inline-flex; align-items: center; gap: 6px; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm); border: 0; background: transparent; cursor: pointer; color: inherit; }
.iconbtn:hover { background: rgba(127, 127, 127, .14); }
.iconbtn.xs { width: 20px; height: 20px; font-size: 9px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.qa { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- boot / auth ---------- */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--muted); padding: 16px; }
.auth { min-height: 100vh; width: 100%; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px 16px; background: radial-gradient(1200px 600px at 20% -10%, var(--brand-soft), transparent), var(--bg); }
.auth-card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 28px; }
.auth-brand { text-align: center; margin-bottom: 18px; }
.auth-mark { width: 60px; height: 60px; border-radius: 14px; margin: 0 auto 10px; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); }
.auth-logo { max-height: 60px; max-width: 220px; margin-bottom: 10px; }
.auth-brand h1 { font-size: 24px; } .auth-brand p { margin: 4px 0 0; color: var(--muted); } .auth-co { font-weight: 600; color: var(--text-2) !important; }
.auth-form { display: grid; gap: 12px; } .auth-form h2 { font-size: 17px; }
.auth-foot { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
.pw { position: relative; display: flex; } .pw input { padding-right: 40px; } .pw .eye { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.form-err { color: var(--err); margin: 0; min-height: 1em; font-size: 13px; }
.note-box, .warn-box { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-sm); font-size: 13px; margin: 8px 0; }
.note-box { background: var(--info-soft); color: var(--text); } .warn-box { background: var(--warn-soft); color: var(--text); }
.note-box .ic { color: var(--info); } .warn-box > .ic { color: var(--warn); }
.warn-box > .grid, .warn-box > table, .warn-box > ul { flex-basis: 100%; }

/* ---------- shell ---------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--brand); color: #fff; position: sticky; top: 0; z-index: 30; }
:root[data-theme="dark"] .top { background: #10263a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .top { background: #10263a; } }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; }
.brand:hover { text-decoration: none; }
.brand .mark { width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 255, 255, .16); display: grid; place-items: center; }
.brand b { display: block; font-size: 15px; } .brand small { display: block; font-size: 11.5px; opacity: .8; }
.gsearch { position: relative; flex: 1; max-width: 560px; display: flex; align-items: center; }
.gsearch > .ic { position: absolute; left: 10px; opacity: .75; }
.top .gsearch input[type=search] { width: 100%; border: 0; border-radius: var(--r-sm); padding: 8px 10px 8px 34px; background: rgba(255, 255, 255, .15); color: #fff; }
.top .gsearch input[type=search]::placeholder { color: rgba(255, 255, 255, .7); }
.top .gsearch input[type=search]:focus { background: #fff; color: #17202c; outline: none; }
.gresults { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); max-height: 420px; overflow: auto; }
.ghit { display: flex; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 8px 12px; cursor: pointer; align-items: center; }
.ghit b { display: block; font-weight: 600; } .ghit small { color: var(--muted); }
.ghit.sel, .ghit:hover { background: var(--brand-soft); }
.gkind { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 64px; text-transform: uppercase; }
.top-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.savestate { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 4px 10px; border-radius: 20px; background: rgba(255, 255, 255, .14); white-space: nowrap; }
.savestate.dirty { background: #f0b252; color: #3a2400; font-weight: 600; } .savestate.saving { background: rgba(255, 255, 255, .3); } .savestate.none { opacity: .75; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, .22); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.menu { position: relative; display: inline-block; }
.menu-list { display: none; position: absolute; right: 0; top: calc(100% + 4px); min-width: 250px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 4px; z-index: 40; }
.actionbar .menu-list { left: 0; right: auto; }
.menu.open .menu-list { display: block; }
.menu-item { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; text-align: left; }
.menu-item:hover:not(:disabled) { background: var(--panel-3); } .menu-item:disabled { color: var(--muted); cursor: default; }
.menu-item small { margin-left: auto; font-size: 11px; }
.actionbar { display: flex; align-items: center; gap: 2px; padding: 4px 12px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 48px; z-index: 25; overflow-x: auto; }
.sepv { width: 1px; height: 22px; background: var(--line); margin: 0 6px; flex: none; } .grow { flex: 1; }
.banner { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 13px; flex-wrap: wrap; }
.banner.err { background: var(--err-soft); color: var(--err); } .banner.warn { background: var(--warn-soft); border-radius: var(--r); margin-bottom: 14px; }
.body { display: grid; grid-template-columns: 224px minmax(0, 1fr); flex: 1; min-height: 0; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 91px; height: calc(100vh - 91px); overflow: auto; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--text-2); font-weight: 550; }
.nav:hover { background: var(--panel-3); text-decoration: none; }
.nav.active { background: var(--brand-soft); color: var(--brand); }
.nav.proj b { display: block; font-size: 12.5px; } .nav.proj small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.nav-sec { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 14px 10px 4px; }
.side-foot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 8px 10px; }
main { min-width: 0; outline: none; }
.page { padding: 20px 24px 40px; max-width: 1560px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head p { margin: 4px 0 0; }

/* ---------- cards / sections ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card.empty, .empty { text-align: center; padding: 28px 16px; color: var(--muted); }
details.sect { padding: 0; }
details.sect > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding: 13px 16px; border-bottom: 1px solid transparent; }
details.sect > summary::-webkit-details-marker { display: none; }
details.sect > summary::before { content: ''; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; align-self: center; }
details.sect[open] > summary::before { transform: rotate(45deg); }
details.sect[open] > summary { border-bottom-color: var(--line); }
.sect-b { padding: 14px 16px 16px; }
.cardfoot { margin-top: 12px; display: flex; justify-content: flex-end; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 16px; }
.grid.tight { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 8px 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid2 > .card { margin-bottom: 0; min-width: 0; }
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; align-items: start; }

/* ---------- fields ---------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field .lbl { font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.req { color: var(--err); }
.field .ctl { display: flex; align-items: stretch; }
input:not([type=checkbox]):not([type=radio]), select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line-2); background: var(--panel); border-radius: var(--r-sm); padding: 7px 9px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
input[readonly], select:disabled { background: var(--panel-2); color: var(--muted); }
input.bad { border-color: var(--err); background: var(--err-soft); }
.field .unit { border: 1px solid var(--line-2); border-left: 0; background: var(--panel-2); color: var(--muted); padding: 7px 8px; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 12px; white-space: nowrap; display: grid; place-items: center; }
.field .ctl:has(.unit) > input, .field .ctl:has(.unit) > select { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field.ro .ctl { padding: 7px 0; font-weight: 600; }
.field.has-err input, .field.has-err select { border-color: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
.field.has-warn input, .field.has-warn select { border-color: var(--warn); }
.field.ovr input, .field.ovr select { border-color: var(--c7); background: color-mix(in srgb, var(--c7) 8%, var(--panel)); }
.field.incell .lbl { display: none; }
.field.incell input, .field.incell select { padding: 5px 6px; font-size: 13px; }
.tipbtn { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; border-radius: 50%; }
.tipbtn:hover { color: var(--brand); }
.tippop { position: absolute; z-index: 60; width: min(340px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 12px 14px; font-size: 13px; }
.tippop p { margin: 6px 0 0; } .tip-t { font-weight: 700; } .tip-r { color: var(--text-2); } .tip-ref { color: var(--muted); font-size: 12px; }
.help { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.outs { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.kv { display: flex; gap: 8px; font-size: 13px; } .kv > span:first-child { color: var(--muted); }
table.kv { border-collapse: collapse; width: 100%; } table.kv th { text-align: left; font-weight: 600; color: var(--muted); padding: 5px 12px 5px 0; width: 40%; vertical-align: top; } table.kv td { padding: 5px 0; }
.out { font-weight: 700; font-variant-numeric: tabular-nums; }
.notes { margin: 0; padding-left: 18px; } .notes li { margin: 4px 0; }

/* ---------- chips / badges ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: var(--panel-3); color: var(--text-2); white-space: nowrap; }
.chip.sm { font-size: 11px; padding: 1px 7px; margin-left: 4px; }
.st-draft { background: var(--panel-3); color: var(--text-2); } .st-in-progress { background: var(--info-soft); color: var(--info); }
.st-calculation-complete { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); } .st-under-review, .st-checked { background: var(--warn-soft); color: var(--warn); }
.st-approved { background: var(--ok-soft); color: var(--ok); } .st-issued { background: color-mix(in srgb, var(--c7) 16%, transparent); color: var(--c7); }
.st-archived, .st-locked { background: var(--panel-3); color: var(--muted); }
.cls-code { background: var(--err-soft); color: var(--err); } .cls-practice { background: var(--info-soft); color: var(--info); } .cls-assumption { background: var(--warn-soft); color: var(--warn); } .cls-user { background: var(--panel-3); color: var(--text-2); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.badge.err { background: var(--err-soft); color: var(--err); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.info { background: var(--info-soft); color: var(--info); }
.badge.zero { opacity: .45; } .badge.sm { font-size: 10.5px; padding: 0 6px; margin-left: 4px; }
.legend { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

/* ---------- dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { position: relative; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
button.kpi { cursor: pointer; } button.kpi:hover { border-color: var(--brand); }
.kpi-l { font-size: 12px; font-weight: 600; color: var(--muted); }
.kpi b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kpi small { color: var(--muted); font-size: 12px; }
.kpi-ic { position: absolute; right: 14px; top: 14px; color: var(--brand); opacity: .75; }
.kpi.hero { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.kpi.hero .kpi-l, .kpi.hero small { color: inherit; opacity: .85; }
.list { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; cursor: pointer; width: 100%; color: inherit; }
.lrow:hover, .lrow.active { background: var(--panel-3); text-decoration: none; }
.lmain { flex: 1; min-width: 0; } .lmain b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lmain small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lnum { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; } .ldate { color: var(--muted); font-size: 12px; min-width: 80px; text-align: right; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 36%) 1fr 90px; gap: 10px; align-items: center; font-size: 13px; }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .hb-v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.hb-t { height: 10px; background: var(--panel-3); border-radius: 5px; overflow: hidden; } .hb-f { display: block; height: 100%; background: var(--brand); border-radius: 5px; }

/* chart series colours */
.c-transmission { background: var(--c1) !important; } .c-product { background: var(--c2) !important; } .c-packaging { background: var(--c3) !important; } .c-respiration { background: var(--c4) !important; }
.c-infiltration { background: var(--c5) !important; } .c-ventilation { background: var(--c6) !important; } .c-people { background: var(--c7) !important; } .c-lights { background: var(--c8) !important; }
.c-forklifts { background: var(--c9) !important; } .c-other { background: var(--c10) !important; } .c-fans { background: var(--c11) !important; } .c-defrost { background: var(--c12) !important; }

 * Equations: ASHRAE Handbook—Fundamentals, Ch. 1 "Psychrometrics"

/*
 * Heat-load calculation engine for refrigerated rooms.
 *
 * Method: W. F. Stoecker, Industrial Refrigeration Handbook; R. J. Dossat, Principles of
 * Refrigeration; ASHRAE Handbook—Refrigeration, "Refrigerated-Facility Loads". All component loads are accumulated as

 *

 *                       + respiration + packaging, scaled to the pull-down time
 *  3. Infiltration      Gosney & Olama door-infiltration equation with Dt, Df, E factors
 *                       (Stoecker / ASHRAE), or the air-change method (Dossat)
 *     Ventilation       ṁ·(h_out − h_in) for mechanical fresh air
 *  4. Internal          people (272 − 6·t W/person), lights, forklifts, other equipment
 *  5. Equipment         evaporator fans, defrost heat released to the room
 *
 * Engine 1.1.0 (Gate 3, approved): G3-1 fan allowance never negative; G3-2 optional product
 * "rate over pull-down" capacity basis; G3-3 optional no credit for heat loss to colder

 * Storage adapters with one async interface:
 *   get(store, key) · all(store) · byIndex(store, field, value) · put(store, value)

    users: { key: 'id', indexes: ['username'] },
    sessions: { key: 'id', indexes: ['userId'] },
    companies: { key: 'id', indexes: ['name'] },
    customers: { key: 'id', indexes: ['name'] },
    projects: { key: 'id', indexes: ['projectNo', 'customerId', 'status', 'modifiedAt', 'archived'] },
    revisions: { key: 'id', indexes: ['projectId'] },
    templates: { key: 'id', indexes: ['kind'] },
    climate: { key: 'id', indexes: ['country'] },
    references: { key: 'id', indexes: ['topic'] },
    attachments: { key: 'id', indexes: ['projectId'] },
    settings: { key: 'key' },

  /** Contextual guidance for inputs: { t: title, x: text, r: typical/recommended range (only where supported), ref } */
  const TIPS = {
    ambientDB: { t: 'Outdoor design dry-bulb', x: 'Summer design air temperature used for exposed walls/roof, door infiltration from outside and fresh air. Use the climatic design value for the site (0.4 % or 1 % annual).', ref: 'ashrae-climate' },

    stored: { t: 'Stored quantity', x: 'Total fresh produce held in the room. Living produce releases heat of respiration continuously.', ref: 'ashrae-foods' },
    resp: { t: 'Heat of respiration', x: 'Heat released by living produce at storage temperature (W per tonne). Strongly temperature dependent — use a value for the storage temperature.', ref: 'ashrae-foods' },
    infMethod: { t: 'Infiltration method', x: 'Door-opening method (Gosney–Olama) uses door size, traffic and protection — preferred for industrial rooms. Air-change method uses empirical air changes per day vs room volume.', ref: 'ashrae-loads' },
    doorSize: { t: 'Door size', x: 'Clear opening width × height. Infiltration rises with area and with the square root of height.' },
    passages: { t: 'Door opening frequency', x: 'Number of times the door is opened per day (forklift/pallet movements). Obtain from the logistics plan: pallets in/out per day divided by pallets per passage.' },
    openSec: { t: 'Open–close time per passage', x: 'Time the doorway is open for each passage, including opening and closing travel.' },
    standMin: { t: 'Time standing open', x: 'Additional minutes per day the door simply stands open (loading, cleaning).' },
    protection: { t: 'Door protection', x: 'Strip curtains, air curtains or vestibules reduce infiltration by effectiveness E. Effectiveness drops when curtains are damaged or poorly maintained.', ref: 'gosney-olama' },
    Df: { t: 'Doorway flow factor', x: 'Accounts for the actual air exchange versus the theoretical fully-developed flow. Auto: 0.8 for ΔT > 11 K, 1.1 otherwise.', ref: 'gosney-olama' },
    acMethod: { t: 'Air-change basis', x: 'Empirical number of air changes per day. Dossat table is limited to 2 832 m³; larger rooms are extrapolated.', ref: 'dossat' },
    ventilation: { t: 'Mechanical fresh air', x: 'Outdoor air supplied deliberately (ripening rooms, CO₂ purge, occupied process rooms). Load = ṁ × (h_out − h_room).' },
    people: { t: 'People', x: 'Heat released per person rises as the room gets colder: 272 − 6·t W (t in °C).', ref: 'ashrae-loads' },
    lights: { t: 'Lighting', x: 'Installed lighting power density × floor area × hours on.' },
    forklifts: { t: 'Forklifts / material handling', x: 'Electrical power drawn inside the room × hours. Use average running power, not nameplate peak.' },
    other: { t: 'Other equipment', x: 'Conveyors, heaters, process machines: power input inside the room × hours.' },
    fans: { t: 'Evaporator fans', x: 'Fan motor heat is released in the room. Before coils are selected, an allowance as % of load is used; replace with actual motor power afterwards.' },
    defrost: { t: 'Defrost heat', x: 'Part of the defrost heat (electric or hot gas) is released into the room. Enter heater/defrost power, cycles, duration and the fraction reaching the room.' },
    heatLossCredit: { t: 'Heat loss to colder surroundings', x: 'Credit: a surface next to a colder space reduces the load (physically correct while the adjacent space is colder). No credit: such surfaces count as zero, which is conservative when the adjacent room may be off, defrosting or warmer.', ref: 'ashrae-loads' },
    productBasis: { t: 'Product load capacity basis', x: 'Daily (default): product heat × 24/pull-down, divided by run time with the other loads. Rate over pull-down: product heat removed at a constant rate over the pull-down time, Q/min(pull-down, run time). Identical when the pull-down time is 24 h.', ref: 'ashrae-loads' },
    propOverride: { t: 'Specific / latent heat override', x: 'Enter values from the product data sheet or ASHRAE tables to replace the Siebel estimates from water content. Blank uses the Siebel value. Overrides are listed in the assumptions register.', ref: 'ashrae-foods' },
    respIn: { t: 'Respiration of incoming produce', x: 'Heat of respiration of the daily intake while it is being cooled, at its mean pull-down temperature (W per tonne). Warm produce respires faster than stored produce. Blank = not included.', ref: 'dossat' },
    fzMode: { t: 'Tunnel type', x: 'Batch: the tunnel is loaded, frozen and unloaded (trolleys, pallets, racks) — product flow = batch mass ÷ freezing time. Continuous: belt or spiral freezer with a steady throughput; residence time = freezing time.', ref: 'workbook-freezing' },
    fzProduct: { t: 'Product (tabulated library)', x: 'Specific heats above/below freezing, latent heat and freezing point from the tabulated library imported from your heat-load workbook. Enter values to override. Check freezing points: some tabulated values are above 0 °C.', ref: 'workbook-freezing' },
    fzShape: { t: 'Product shape and dimension', x: 'Choose the geometry closest to the product: slab/carton (D = thickness in the direction of heat flow), cylinder or sphere (D = diameter). Freezing time rises roughly with D (surface-controlled) to D² (conduction-controlled).', ref: 'ashrae-freezing' },
    hAir: { t: 'Surface heat-transfer coefficient', x: 'Convective coefficient between the air and the product surface. It increases with air velocity over the product. Use the freezer supplier’s value or ASHRAE tabulated data for the air velocity.', ref: 'ashrae-freezing' },
    Rpack: { t: 'Packaging / air-gap resistance', x: 'Thermal resistance of cartons, film and air gaps between packaging and product (m²K/W). Effective h = 1/(1/h_air + R). Cartons can dominate the freezing time.', ref: 'ashrae-freezing' },
    Tm: { t: 'Tunnel air temperature', x: 'Air temperature around the product during freezing. Must be below the product freezing point; lower air temperature shortens freezing but lowers the suction temperature.', ref: 'ashrae-freezing' },
    Tc: { t: 'Final centre temperature', x: 'Temperature the thermal centre must reach at the end of freezing (e.g. −18 °C). Defines the freezing time.', ref: 'ashrae-freezing' },
    T2: { t: 'Final average (equilibrium) temperature', x: 'Mass-average product temperature after equalisation, used for the heat removed per kg. Blank = centre temperature.', ref: 'workbook-freezing' },
    timeBasis: { t: 'Freezing-time basis for the load', x: 'Pham (recommended, includes pre- and sub-cooling), Plank (latent heat only, shorter), or an entered design time from tests or the supplier. The load uses the product flow over this time.', ref: 'ashrae-freezing' },
    kF: { t: 'Frozen conductivity and densities', x: 'Thermal conductivity of the frozen product and densities unfrozen/frozen. Typical defaults are shown — use product data (ASHRAE Thermal Properties of Foods) where available.', ref: 'ashrae-foods' },
    peak: { t: 'Load distribution factor', x: 'Batch freezing releases heat faster at the start. A factor above 1.0 sizes for the higher early load instead of the average. This is an application assumption, not a code value.', ref: 'ashrae-freezing' },
    lossPct: { t: 'Loss & safety allowance', x: 'Workbook method: Q_design = Q ÷ (1 − x) (10 % → +11.1 %). Alternatively Q × (1 + x).', ref: 'workbook-freezing' },
    airDT: { t: 'Air temperature rise across the product', x: 'Used to estimate the air volume the evaporator fans must circulate: V̇ = Q/(ρ·c_p·ΔT). Smaller ΔT gives more uniform freezing but more airflow.' },
    evapK: { t: 'Coil K-value & LMTD', x: 'Used only for the rule-of-thumb air-cooler surface check: A = Q / (K × LMTD).' },
    mrCode: { t: 'Code basis', x: 'Select the code or standard in force for the machinery room. Rates differ between editions.', ref: 'iiar-mrvt' },
    mrCharge: { t: 'Refrigerant charge', x: 'Charge of the largest system served by the room. Used by charge-based emergency rates (older codes, non-ammonia).' },
    mrTsa: { t: 'Supply air temperature', x: 'Make-up air temperature at design (1 % ASHRAE). Normal ventilation limits the room to 40 °C under IIAR 2-2008A.', ref: 'iiar2a-13.3.8.1' },
  };

  const CLASS_LABEL = { code: 'Required / code-based', practice: 'Recommended engineering practice', assumption: 'Application assumption', user: 'User-defined input' };

  const api = { REFERENCES, TIPS, CLASS_LABEL };
  root.CL = root.CL || {};
  root.CL.refs = api;
  if (typeof module === 'object' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  <script>
/*
 * Engineering validation. Reads inputs and engine results; never modifies either.
 * Levels: 'error' (calculation cannot be relied on / cannot proceed), 'warning' (review
 * input), 'info' (guidance). Each message: { level, code, scope, roomId?, tab?, field?, msg }.
 * Where the v1 engine silently clamps a value, an ERROR states what the engine would use.
 */
(function (root) {
  'use strict';
  const blank = (v) => v === '' || v == null || (typeof v === 'number' && !Number.isFinite(v));
  const n = (v) => +v;

  function validateProject(data, calc, D, V) {
    const out = [];
    const add = (level, code, msg, loc = {}) => out.push({ level, code, msg, scope: loc.roomId ? 'room' : loc.mr != null ? 'machinery' : loc.tunnel != null ? 'tunnel' : 'project', ...loc });
    const d = data.design || {};

    if (blank(d.ambientDB)) add('error', 'P01', 'Outdoor design dry-bulb temperature is missing.', { tab: 'criteria', field: 'ambientDB' });
    else if (n(d.ambientDB) < -40 || n(d.ambientDB) > 60) add('warning', 'P02', `Outdoor design dry-bulb ${d.ambientDB} °C is outside the usual −40…60 °C range.`, { tab: 'criteria', field: 'ambientDB' });
    if (blank(d.ambientRH)) add('error', 'P03', 'Outdoor coincident relative humidity is missing.', { tab: 'criteria', field: 'ambientRH' });
    else if (n(d.ambientRH) < 0 || n(d.ambientRH) > 100) add('error', 'P04', 'Outdoor RH must be between 0 and 100 %.', { tab: 'criteria', field: 'ambientRH' });
    if (!blank(d.altitude) && (n(d.altitude) < -500 || n(d.altitude) > 5000)) add('warning', 'P05', `Site altitude ${d.altitude} m looks unusual.`, { tab: 'criteria', field: 'altitude' });
    if (blank(d.groundTemp)) add('warning', 'P06', 'Ground temperature is blank; 10 °C is used for floors on ground.', { tab: 'criteria', field: 'groundTemp' });
    if (!(data.rooms || []).length) add('info', 'P07', 'No rooms have been added yet.', { tab: 'rooms' });

    for (const r of data.rooms || []) {
      const loc = (tab, field) => ({ roomId: r.id, room: r.name, tab, field });
      const T = r.cond && r.cond.T, RH = r.cond && r.cond.RH;
      const dims = r.dims || {};
      for (const k of ['L', 'W', 'H']) {
        if (blank(dims[k])) add('error', 'R01', `${label(k)} is missing.`, loc('general', k));
        else if (n(dims[k]) <= 0) add('error', 'R02', `${label(k)} must be greater than zero (entered ${dims[k]} m).`, loc('general', k));
      }
      if (blank(T)) add('error', 'R03', 'Room design temperature is missing (the engine would use 0 °C).', loc('general', 'T'));
      else if (n(T) < -60 || n(T) > 30) add('warning', 'R04', `Room temperature ${T} °C is outside the usual −60…30 °C range.`, loc('general', 'T'));
      if (blank(RH)) add('error', 'R05', 'Room relative humidity is missing.', loc('general', 'RH'));
      else if (n(RH) < 0 || n(RH) > 100) add('error', 'R06', 'Room RH must be between 0 and 100 %.', loc('general', 'RH'));
      if (blank(r.runHours) || n(r.runHours) <= 0 || n(r.runHours) > 24) add('error', 'R07', `Run time must be > 0 and ≤ 24 h/day (entered "${r.runHours}"; the engine would use ${Math.max(1, Math.min(24, n(r.runHours) || 18))} h).`, loc('general', 'runHours'));
      else if (n(r.runHours) < 12 || n(r.runHours) > 22) add('warning', 'R08', `Run time ${r.runHours} h/day is unusual; typical is 16–20 h to allow defrost.`, loc('general', 'runHours'));
      if (!blank(r.TD) && n(r.TD) <= 0) add('error', 'R09', 'Evaporator TD must be greater than zero.', loc('general', 'TD'));
      else if (!blank(r.TD) && n(r.TD) > 15) add('warning', 'R10', `Evaporator TD ${r.TD} K is large; expect low room humidity and product weight loss.`, loc('general', 'TD'));
      else if (!blank(r.TD) && !blank(RH) && n(RH) >= 90 && n(r.TD) > 6) add('warning', 'R11', `TD ${r.TD} K is high for ${RH} % RH; high-RH rooms normally use 4–6 K.`, loc('general', 'TD'));
      if (!blank(r.safety) && n(r.safety) < 0) add('error', 'R12', 'Safety factor cannot be negative.', loc('general', 'safety'));
      else if (!blank(r.safety) && n(r.safety) > 30) add('warning', 'R13', `Safety factor ${r.safety} % is high; check it is not duplicating other allowances.`, loc('general', 'safety'));

      for (const s of r.surfaces || []) {
        if (!blank(s.areaOverride) && n(s.areaOverride) < 0) add('error', 'T01', `${s.label}: area override cannot be negative.`, loc('transmission'));
        if (!blank(s.uOverride) && n(s.uOverride) < 0) add('error', 'T02', `${s.label}: U-value override cannot be negative.`, loc('transmission'));
        if (blank(s.uOverride) && (s.ins === 'NONE' || !(n(s.thk) > 0))) {
          add(s.key === 'floor' && n(T) > 5 ? 'info' : 'warning', 'T03', `${s.label}: no insulation entered.`, loc('transmission'));
        }
        if (s.adj !== 'ambient' && s.adj !== 'ground' && blank(s.tAdj)) add('error', 'T04', `${s.label}: adjacent space temperature is missing.`, loc('transmission'));
      }
      if (n(T) < 0) add('info', 'T05', 'Room below 0 °C: provide under-floor heating/ventilation against frost heave and set the ground temperature to the heater set-point.', loc('transmission'));

      if (!(r.products || []).length && ['chiller', 'produce', 'freezer', 'blast', 'ripening'].includes(r.type)) add('warning', 'M01', 'No product load entered for a storage/processing room.', loc('product'));
      for (const [i, p] of (r.products || []).entries()) {
        const pl = `Product ${i + 1}`;
        const ref = D.products.find((x) => x.id === p.productId) || {};
        if (blank(p.mass) || n(p.mass) < 0) add('error', 'M02', `${pl}: product quantity is missing or negative.`, loc('product'));
        else if (n(p.mass) === 0) add('warning', 'M03', `${pl}: product quantity is zero, so no product load is calculated.`, loc('product'));
        if (blank(p.tIn)) add('error', 'M04', `${pl}: entering temperature is missing (the engine would use 0 °C).`, loc('product'));
        if (!blank(p.tOut) && !blank(T) && n(p.tOut) < n(T)) add('warning', 'M05', `${pl}: final temperature ${p.tOut} °C is below the room temperature ${T} °C, which cannot be reached by room air.`, loc('product'));
        if (!blank(p.tIn) && !blank(p.tOut) && n(p.tIn) <= n(p.tOut)) add('warning', 'M06', `${pl}: entering temperature is not above the final temperature, so no product load results.`, loc('product'));
        if (!blank(p.pullDown) && (n(p.pullDown) <= 0 || n(p.pullDown) > 24)) add('error', 'M07', `${pl}: pull-down time must be > 0 and ≤ 24 h (entered ${p.pullDown}; the engine would use ${Math.max(1, Math.min(24, n(p.pullDown)))} h).`, loc('product'));
        else if (!blank(p.pullDown) && n(p.pullDown) < 1) add('warning', 'M08', `${pl}: pull-down time under 1 h.`, loc('product'));
        if (!blank(p.crf) && (n(p.crf) <= 0 || n(p.crf) > 1)) add('error', 'M09', `${pl}: chilling rate factor must be > 0 and ≤ 1 (the engine would use 1.0).`, loc('product'));
        if (!blank(p.xw) && (n(p.xw) < 0 || n(p.xw) > 100)) add('error', 'M10', `${pl}: water content must be 0–100 %.`, loc('product'));
        if (p.productId === 'custom' && blank(p.xw)) add('warning', 'M11', `${pl}: custom product uses placeholder water content ${ref.xw} %. Enter product data.`, loc('product'));
        if (n(p.stored) > 0 && !(n(blank(p.resp) ? ref.resp : p.resp) > 0)) add('info', 'M12', `${pl}: stored quantity entered but heat of respiration is zero for this commodity.`, loc('product'));
        if (ref.resp > 0 && !(n(p.stored) > 0)) add('info', 'M13', `${pl}: ${ref.name} respires; enter the stored quantity to include heat of respiration.`, loc('product'));
        if (!blank(p.packPct) && n(p.packPct) < 0) add('error', 'M14', `${pl}: packaging mass cannot be negative.`, loc('product'));
        for (const [k, lbl] of [['cpA', 'specific heat above freezing'], ['cpB', 'specific heat below freezing'], ['hLat', 'latent heat']]) {
          if (!blank(p[k]) && !(n(p[k]) > 0)) add('error', 'M15', `${pl}: entered ${lbl} must be greater than zero (blank = Siebel value).`, loc('product'));
        }
        if (!blank(p.cpA) && !blank(p.cpB) && n(p.cpB) > n(p.cpA)) add('warning', 'M16', `${pl}: specific heat below freezing is higher than above freezing; check the data.`, loc('product'));
        if (!blank(p.respIn) && n(p.respIn) < 0) add('error', 'M17', `${pl}: incoming-produce respiration cannot be negative.`, loc('product'));
        if (r.productBasis === 'pulldown' && !blank(p.pullDown) && n(p.pullDown) < n(r.runHours)) add('info', 'M18', `${pl}: product load taken at the pull-down rate (${p.pullDown} h), not spread over the ${r.runHours} h run time.`, loc('product'));
      }

      if (r.infMethod === 'airchange') {
        const ac = r.airChange || {};
        if (ac.method === 'manual' && !(n(ac.nManual) >= 2)) add('warning', 'I01', 'Manual air changes below the recommended minimum of 2 per day.', loc('infiltration'));
        if (ac.adj === 'custom' && (blank(ac.tAdj) || blank(ac.rhAdj))) add('error', 'I02', 'Adjacent space temperature/RH for infiltrating air is missing.', loc('infiltration'));
      } else {
        if (!(r.doors || []).length) add('warning', 'I03', 'No doors entered: door infiltration load is zero.', loc('infiltration'));
        for (const [i, d] of (r.doors || []).entries()) {
          const dl = d.name || `Door ${i + 1}`;
          if (!(n(d.w) > 0) || !(n(d.h) > 0)) add('error', 'I04', `${dl}: door width and height must be greater than zero.`, loc('infiltration'));
          if (n(d.passages) < 0 || n(d.openSec) < 0 || n(d.standMin) < 0) add('error', 'I05', `${dl}: door usage values cannot be negative.`, loc('infiltration'));
          const openH = (n(d.passages) * n(d.openSec) + 60 * n(d.standMin)) / 3600;
          if (openH > 24) add('error', 'I06', `${dl}: door open time ${openH.toFixed(1)} h/day exceeds 24 h.`, loc('infiltration'));
          else if (openH > 12) add('warning', 'I07', `${dl}: door open ${openH.toFixed(1)} h/day; consider a rapid-roll door or vestibule.`, loc('infiltration'));
          if (d.protection === 'custom' && (blank(d.E) || n(d.E) < 0 || n(d.E) > 1)) add('error', 'I08', `${dl}: protection effectiveness E must be between 0 and 1.`, loc('infiltration'));
          if (d.adj === 'custom' && (blank(d.tAdj) || blank(d.rhAdj))) add('error', 'I09', `${dl}: adjacent space temperature/RH is missing.`, loc('infiltration'));
          if (!blank(d.Df) && n(d.Df) <= 0) add('error', 'I10', `${dl}: doorway flow factor must be positive.`, loc('infiltration'));
        }
      }
      const i = r.internal || {}, e = r.equipment || {};
      for (const k of ['people', 'peopleHours', 'lightsWm2', 'lightsHours', 'forklifts', 'forkliftKW', 'forkliftHours', 'otherKW', 'otherHours']) if (n(i[k]) < 0) add('error', 'N01', `Internal load value "${k}" cannot be negative.`, loc('internal'));
      for (const k of ['peopleHours', 'lightsHours', 'forkliftHours', 'otherHours']) if (n(i[k]) > 24) add('error', 'N02', `Operating hours "${k}" exceed 24 h/day.`, loc('internal'));
      if (e.fanMode !== 'kw' && n(e.fanPct) > 20) add('warning', 'N03', `Fan allowance ${e.fanPct} % is high; typical 5–10 % before coil selection.`, loc('internal'));
      if (e.fanMode === 'kw' && n(e.fanHours) > 24) add('error', 'N04', 'Fan operating hours exceed 24 h/day.', loc('internal'));
      if (n(e.defrostFrac) < 0 || n(e.defrostFrac) > 100) add('error', 'N05', 'Defrost heat to room must be 0–100 %.', loc('internal'));
      if (n(T) < 0 && !(n(e.defrostKW) > 0)) add('info', 'N06', 'Room below 0 °C with no defrost heat entered.', loc('internal'));

      // Result-based checks (only if inputs are sane enough to calculate)
      if (!out.some((m) => m.roomId === r.id && m.level === 'error')) {
        let res;
        try { res = calc.calcRoom(r, data); } catch (err) { add('error', 'X01', `Calculation failed: ${err.message}`, loc('results')); continue; }
        const nc = res.transmission.items.filter((s) => s.notCredited);
        if (nc.length) add('info', 'X08', `Heat loss not credited (project option): ${nc.map((s) => s.label).join(', ')} counted as zero instead of ${nc.reduce((a, s) => a + s.rawKW * 24, 0).toFixed(1)} kWh/day.`, loc('transmission'));
        const credit = res.transmission.items.filter((s) => s.kW < 0);
        if (credit.length) add('warning', 'X02', `Heat loss to colder surroundings is credited (${credit.map((s) => s.label).join(', ')}): ${res.transmission.items.filter((s) => s.kW < 0).reduce((a, s) => a + s.kWh, 0).toFixed(1)} kWh/day reduces the load. Confirm the adjacent space is always colder, or select “no credit” under Design criteria.`, loc('transmission'));
        if (res.subtotal <= 0) add('error', 'X03', 'Net calculated load is zero or negative; check adjacent temperatures and inputs.', loc('results'));
        if (res.equipment.fans < 0) add('error', 'X04', 'Fan allowance became negative because the base load is negative.', loc('internal'));
        if (res.infiltration.airChange && res.infiltration.airChange.extrapolated) add('warning', 'X05', `Room volume ${res.volume.toFixed(0)} m³ is outside the Dossat air-change table (≤ 2 832 m³); value extrapolated. Prefer the door-opening method.`, loc('infiltration'));
        const [lo, hi] = res.kcalRange;
        if (res.kcalM3Day > 2 * hi) add('warning', 'X06', `Room load excluding product is ${res.kcalM3Day.toFixed(0)} kcal/m³·day, well above the typical ${lo}–${hi}. Check inputs for an unusually high load.`, loc('results'));
        if (res.loadDensity > 300) add('warning', 'X07', `Load density ${res.loadDensity.toFixed(0)} W/m³ is very high.`, loc('results'));
      }
    }

    // Tunnel / blast freezers (freezing engine)
    const FZ = root.HLFreeze || (typeof require === 'function' && require('../freeze.js'));
    const LIB = (root.CL && root.CL.productsTab) || (typeof require === 'function' && require('./products-tab.js'));
    for (const [ti, t] of (data.tunnels || []).entries()) {
      const loc = { tunnel: ti, room: t.name, tab: 'tunnel' };
      const batch = t.mode !== 'continuous';
      if (batch && !(n(t.batchKg) > 0)) add('error', 'F01', 'Batch mass must be greater than zero.', { ...loc, field: 'batchKg' });
      if (!batch && !(n(t.throughput) > 0)) add('error', 'F01', 'Product throughput must be greater than zero.', { ...loc, field: 'throughput' });
      if (!(n(t.D) > 0)) add('error', 'F02', 'Product thickness / diameter must be greater than zero.', { ...loc, field: 'D' });
      if (!(n(t.hAir) > 0)) add('error', 'F03', 'Surface heat-transfer coefficient must be greater than zero.', { ...loc, field: 'hAir' });
      if (n(t.Rpack) < 0) add('error', 'F03', 'Packaging resistance cannot be negative.', { ...loc, field: 'Rpack' });
      const pr = FZ.props(t, LIB.PRODUCTS);
      if (!(pr.kF > 0) || !(pr.rhoF > 0) || !(pr.rhoU > 0)) add('error', 'F04', 'Frozen conductivity and densities must be greater than zero.', loc);
      if (!(pr.cpA > 0) || !(pr.cpB > 0) || !(pr.hLat > 0)) add('error', 'F09', 'Product specific heats and latent heat are required (select a library product or enter them).', loc);
      if (pr.source === 'library' && pr.ref.Tf > 0 && (t.product.Tf === '' || t.product.Tf == null)) add('warning', 'F08', `Library freezing point for “${pr.ref.name}” is +${pr.ref.Tf} °C (as tabulated in the workbook) — foods freeze below 0 °C. Enter the correct initial freezing point.`, { ...loc, field: 'Tf' });
      if (n(t.Tm) >= pr.Tf) add('error', 'F05', `Air temperature ${t.Tm} °C must be below the product freezing point ${pr.Tf} °C.`, { ...loc, field: 'Tm' });
      if (n(t.Tc) <= n(t.Tm)) add('error', 'F06', 'Final centre temperature must be above the air temperature (it can only approach it).', { ...loc, field: 'Tc' });
      else if (n(t.Tc) >= pr.Tf) add('warning', 'F07', 'Final centre temperature is not below the freezing point — the product centre is not frozen.', { ...loc, field: 'Tc' });
      if (n(t.Ti) <= pr.Tf) add('info', 'F16', 'Product enters already frozen — only sensible cooling below freezing is calculated.', { ...loc, field: 'Ti' });
      if (t.lossMethod !== 'factor' && n(t.lossPct) >= 100) add('error', 'F13', 'Loss & safety must be below 100 % with the Q ÷ (1 − x) method.', { ...loc, field: 'lossPct' });
      if (n(t.peak, 1) < 1) add('warning', 'F15', 'Load distribution factor below 1.0 reduces the product load below its average.', { ...loc, field: 'peak' });
      try {
        const r = FZ.calcTunnel(t, data, LIB.PRODUCTS);
        if (r.freezing.valid && t.timeBasis === 'entered') {
          if (!(n(t.tDesign) > 0)) add('error', 'F10', 'Enter the design freezing time or select a calculated basis.', { ...loc, field: 'tDesign' });
          else if (n(t.tDesign) < r.freezing.phamH) add('warning', 'F10', `Design freezing time ${t.tDesign} h is shorter than the calculated time ${r.freezing.phamH.toFixed(1)} h (Pham): the product may not reach ${t.Tc} °C at the centre.`, { ...loc, field: 'tDesign' });
        }
        if (t.timeBasis === 'plank') add('info', 'F11', `Plank's equation ignores pre-cooling and sub-cooling; it gives ${r.freezing.plankH.toFixed(1)} h vs ${r.freezing.phamH.toFixed(1)} h by Pham's method.`, { ...loc, field: 'timeBasis' });
        if (r.freezing.valid && r.freezing.Bi > 20) add('info', 'F12', `Biot number ${r.freezing.Bi.toFixed(1)}: freezing is controlled by internal conduction; more air velocity gives little benefit.`, loc);
      } catch (err) { add('error', 'F99', `Freezing calculation failed: ${err.message}`, loc); }
    }

    for (const [mi, m] of (data.machinery || []).entries()) {
      const loc = { mr: mi, room: m.name, tab: 'machinery' };
      for (const k of ['L', 'W', 'H']) if (!(n(m[k]) > 0)) add('error', 'V01', `Machinery room ${label(k).toLowerCase()} must be greater than zero.`, loc);
      const code = V.codes[m.code];
      if (code && code.ammoniaOnly && m.refrigerant !== 'ammonia') add('warning', 'V02', `${code.name} applies to ammonia systems, but the refrigerant is set to non-ammonia.`, loc);
      if (!(n(m.chargeKg) > 0)) add('warning', 'V03', 'Refrigerant charge is zero or missing.', loc);
      if (m.detector === 'yes' && n(m.setpoint) > n(m.maxSetpoint)) add('warning', 'V04', 'Detector setpoint exceeds the maximum allowed; continuous ventilation at the emergency rate is required.', loc);
      try {
        const r = V.calcMachineryRoom(m);
        for (const mode of ['normal', 'continuous', 'emergency']) if (r[mode].ok === false) add('warning', 'V05', `Installed ${mode} ventilation is below the required rate.`, loc);
      } catch (err) { add('error', 'V06', `Ventilation calculation failed: ${err.message}`, loc); }
    }
    return out;
  }

  function label(k) { return { L: 'Length', W: 'Width', H: 'Height' }[k] || k; }
  const count = (list) => list.reduce((a, m) => (a[m.level]++, a), { error: 0, warning: 0, info: 0 });

  const api = { validateProject, count };
  root.CL = root.CL || {};
  root.CL.validate = api;
  if (typeof module === 'object' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
  <script>
/*
 * Calculation transparency and the engineering assumptions register.
 * Builds audit-ready explanations from engine inputs and outputs (SI, the engine's internal
 * units). Nothing here recalculates loads differently from the engine: values shown are the
 * engine's own intermediate results.
 */
(function (root) {
  'use strict';
  const f = (v, d = 2) => (Number.isFinite(v) ? (+v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–');

  function explainRoom(room, res, project, D) {
    const blocks = [];
    const Ti = +room.cond.T;
    blocks.push({
      id: 'transmission', title: 'Transmission load', ref: 'ashrae-loads',
      formula: 'Q = U · A · ΔT,   U = 1 / (1/hᵢ + L/k + 1/hₒ + R_extra),   ΔT = T_out (+ sun effect) − T_room',
      table: {
        head: ['Surface', 'A [m²]', 'U [W/m²K]', 'T_out [°C]', 'ΔT [K]', 'Q [kW]', 'Q [kWh/day]'],
        rows: res.transmission.items.map((s) => [s.label, f(s.A, 1), f(s.U, 3), f(s.To, 1), f(s.dT, 1), f(s.kW, 3), f(s.kWh, 1)]),
      },
      notes: [`hᵢ = ${D.film.inside} W/m²K; hₒ = ${D.film.outside} W/m²K outdoors, ${D.film.adjacent} W/m²K to adjacent spaces, none to ground.`, `T_room = ${f(Ti, 1)} °C.`,
        res.heatLossCredit === 'none' ? 'Project option: heat loss to colder surroundings is not credited (Q = max(0, U·A·ΔT)).' : 'Heat loss to colder surroundings is credited (negative loads reduce the total).',
        ...res.transmission.items.filter((s) => s.notCredited).map((s) => `${s.label}: ${f(s.rawKW, 3)} kW not credited.`)],
      result: [res.transmission.kWh, 'kWh/day'],
    });

    const pr = res.product;
    blocks.push({
      id: 'product', title: 'Product, packaging and respiration', ref: 'ashrae-foods',
      formula: 'q = c_pa(T₁ − T_f) + h_if + c_pb(T_f − T₂);  c_pa = 3.35·x_w + 0.84,  c_pb = 1.26·x_w + 0.84,  h_if = 334·x_w [kJ/kg] (unless entered);  Q = m·q/3600 × 24/t_pull ÷ CRF;  Q_pack = m_pack·c_p·ΔT/3600 × 24/t_pull;  Q_resp = (stored[t] × w + intake[t/day] × w_in) × 24/1000',
      table: {
        head: ['Product', 'm [kg/day]', 'T₁→T₂ [°C]', 'T_f [°C]', 'c_pa / c_pb [kJ/kg·K]', 'h_if [kJ/kg]', 'q [kJ/kg]', 't_pull [h]', 'CRF', 'Product [kWh/day]', 'Pack. [kWh/day]', 'Resp. [kWh/day]'],
        rows: pr.items.map((p) => [p.label, f(p.mass, 0), `${f(p.T1, 1)} → ${f(p.T2, 1)}`, f(p.Tf, 1), `${f(p.props.cpAbove, 2)} / ${f(p.props.cpBelow, 2)}`, f(p.props.latent, 1), f(p.qkg, 1), f(p.pull, 1), f(p.crf, 2), f(p.kWhProduct, 1), f(p.kWhPack, 1), f(p.kWhResp, 1)]),
      },
      notes: ['Specific and latent heats from water content (Siebel; latent heat assumes all water freezes) unless entered values are shown as overridden.',
        ...pr.items.filter((p) => Object.keys(p.overridden || {}).length).map((p) => `${p.label}: entered ${Object.keys(p.overridden).map((k) => ({ cpAbove: 'c_pa', cpBelow: 'c_pb', latent: 'h_if' }[k])).join(', ')}.`),
        ...pr.items.filter((p) => p.kWhRespIn > 0).map((p) => `${p.label}: incoming-produce respiration ${f(p.kWhRespIn, 1)} kWh/day included.`),
        res.productBasis === 'pulldown'
          ? `Capacity basis “rate over pull-down”: product heat Q_day × (1 + SF) / min(t_pull, t_run) — adjustment ${f(res.productRateAdjKW, 3)} kW relative to the daily basis.`
          : 'Capacity basis “daily”: load concentrated into the pull-down time, expressed per 24 h, then divided by run time with the other loads.'],
      result: [pr.kWh, 'kWh/day'],
    });

    const inf = res.infiltration;
    if (inf.airChange) {
      const a = inf.airChange;
      blocks.push({
        id: 'infiltration', title: 'Infiltration — air-change method', ref: room.airChange && room.airChange.method === 'dossat' ? 'dossat' : 'workbook-ac',
        formula: 'Q = V · n · (h_out − h_room) / v_out / 3600',
        table: { head: ['Quantity', 'Value', 'Unit'], rows: [
          ['Room volume V', f(res.volume, 1), 'm³'], ['Air changes n', f(a.n, 3), 'per day'], ['Basis', a.basis, ''],
          ['h_out', f(a.outside.h, 2), 'kJ/kg dry air'], ['h_room', f(inf.inside.h, 2), 'kJ/kg dry air'], ['v_out', f(a.outside.v, 4), 'm³/kg dry air'],
          ['Moisture load', f(a.moisture, 2), 'kg/day']] },
        notes: a.extrapolated ? ['Volume outside the tabulated range — value extrapolated.'] : [],
        result: [a.kWh, 'kWh/day'],
      });
    } else {
      blocks.push({
        id: 'infiltration', title: 'Door infiltration — Gosney & Olama', ref: 'gosney-olama',
        formula: 'q = 0.221 · A · (h_i − h_r) · ρ_r · (1 − ρ_i/ρ_r)^0.5 · (g·H)^0.5 · F_m,  F_m = [2/(1 + (ρ_r/ρ_i)^(1/3))]^1.5;  Q = q · t_open · D_f · (1 − E)',
        table: {
          head: ['Door', 'A [m²]', 'h_i / h_r [kJ/kg]', 'ρ_i / ρ_r [kg/m³]', 'q open [kW]', 't_open [h/day]', 'D_f', 'E', 'Q [kWh/day]', 'Moisture [kg/day]'],
          rows: inf.items.map((d) => [d.label, f(d.A, 2), `${f(d.outside.h, 1)} / ${f(inf.inside.h, 1)}`, `${f(d.outside.rho, 3)} / ${f(inf.inside.rho, 3)}`, f(d.qOpen, 2), f(d.openH, 3), f(d.Df, 2), f(d.E, 2), f(d.kWh, 1), f(d.moisture, 2)]),
        },
        notes: ['t_open = (passages × open–close time + 60 × minutes standing open) / 3600.', 'Air properties at site pressure (ASHRAE psychrometric equations).'],
        result: [inf.kWhDoors, 'kWh/day'],
      });
    }
    if (inf.vent.kWh > 0) blocks.push({ id: 'ventilation', title: 'Mechanical ventilation air', ref: 'ashrae-psychro', formula: 'Q = (V̇ / v_out) · (h_out − h_room) × hours', table: { head: ['Quantity', 'Value', 'Unit'], rows: [['Outdoor air', f(+room.ventilation.m3h, 0), 'm³/h'], ['Operation', f(+room.ventilation.hours, 1), 'h/day'], ['Moisture', f(inf.vent.moisture, 2), 'kg/day']] }, notes: [], result: [inf.vent.kWh, 'kWh/day'] });

    const it = res.internal, i = room.internal || {};
    const floorA = (+room.dims.L || 0) * (+room.dims.W || 0);
    blocks.push({
      id: 'internal', title: 'Internal loads', ref: 'ashrae-loads',
      formula: 'People: n · (272 − 6·t) W · h;  Lighting: W/m² · A_floor · h;  Forklifts: n · kW · h;  Other: kW · h',
      table: { head: ['Item', 'Inputs', 'Q [kWh/day]'], rows: [
        ['People', `${+i.people || 0} × ${f(it.perPerson, 0)} W × ${+i.peopleHours || 0} h`, f(it.people, 1)],
        ['Lighting', `${+i.lightsWm2 || 0} W/m² × ${f(floorA, 0)} m² × ${+i.lightsHours || 0} h`, f(it.lights, 1)],
        ['Forklifts', `${+i.forklifts || 0} × ${+i.forkliftKW || 0} kW × ${+i.forkliftHours || 0} h`, f(it.forklifts, 1)],
        ['Other equipment', `${+i.otherKW || 0} kW × ${+i.otherHours || 0} h`, f(it.other, 1)]] },
      notes: [], result: [it.kWh, 'kWh/day'],
    });
    const e = room.equipment || {};
    blocks.push({
      id: 'equipment', title: 'Evaporator fans and defrost', ref: 'ashrae-loads',
      formula: e.fanMode === 'kw' ? 'Fans: kW · h;  Defrost: kW · cycles · min/60 · fraction to room' : 'Fans: % × (transmission + product + infiltration + internal);  Defrost: kW · cycles · min/60 · fraction to room',
      table: { head: ['Item', 'Inputs', 'Q [kWh/day]'], rows: [
        ['Fans', e.fanMode === 'kw' ? `${+e.fanKW || 0} kW × ${+e.fanHours || 0} h` : `${+e.fanPct || 0} % of base load`, f(res.equipment.fans, 1)],
        ['Defrost', `${+e.defrostKW || 0} kW × ${+e.defrostPerDay || 0} × ${+e.defrostMin || 0} min × ${+e.defrostFrac || 0} %`, f(res.equipment.defrost, 1)]] },
      notes: [], result: [res.equipment.kWh, 'kWh/day'],
    });
    blocks.push({
      id: 'total', title: 'Design refrigeration capacity', ref: 'ashrae-loads',
      formula: res.productBasis === 'pulldown' ? 'Q_design = Σ loads × (1 + safety) ÷ run time + product pull-down rate adjustment' : 'Q_design = Σ loads × (1 + safety) ÷ run time',
      table: { head: ['Quantity', 'Value', 'Unit'], rows: [
        ['Σ loads (subtotal)', f(res.subtotal, 1), 'kWh/day'], ['Safety / design allowance', `${f(res.safety, 0)} % = ${f(res.safetyKWh, 1)}`, 'kWh/day'],
        ['Total', f(res.total, 1), 'kWh/day'], ['Run time', f(res.runHours, 1), 'h/day'], ['Total ÷ run time', f(res.total / res.runHours, 2), 'kW'],
        ...(res.productBasis === 'pulldown' ? [['Product pull-down rate adjustment', f(res.productRateAdjKW, 3), 'kW']] : []),
        ['Design capacity', f(res.capacity, 2), 'kW'],
        ['Evaporator TD / SST', `${f(res.TD, 1)} K / ${f(res.sst, 1)} °C`, '']] },
      notes: [], result: [res.capacity, 'kW'],
    });
    return blocks;
  }

  /** Transparency for a tunnel / blast freezer (freezing engine). */
  function explainTunnel(t, r) {
    const fz = r.freezing, p = r.props;
    return [
      { id: 'ftime', title: 'Freezing time', ref: 'ashrae-freezing',
        formula: 'Plank: t = ρ_f·L/(T_f − T_m)·(P·D/h + R·D²/k_f).   Pham: t = d/(E·h)·(ΔH₁/ΔT₁ + ΔH₂/ΔT₂)·(1 + Bi/2);  T_fm = 1.8 + 0.263·T_c + 0.105·T_m;  h = 1/(1/h_air + R_pack)',
        table: { head: ['Quantity', 'Value', 'Unit'], rows: [
          ['Shape (P, R, E)', `${fz.shape.name} (${f(fz.shape.P, 3)}, ${f(fz.shape.R, 4)}, ${fz.shape.E})`, ''], ['D / d', `${f(+t.D, 3)} / ${f(fz.d, 3)}`, 'm'],
          ['h_air → h_eff', `${f(+t.hAir, 1)} → ${f(fz.hEff, 2)}`, 'W/m²K'], ['k_f, ρ_u, ρ_f', `${f(p.kF, 2)}, ${f(p.rhoU, 0)}, ${f(p.rhoF, 0)}`, 'W/mK, kg/m³'],

  /**
   * Assumptions register: default / database / user-selected / user-overridden.
   * kind: 'default' | 'database' | 'user' | 'override' | 'note'
   */
  function assumptions(data, D, M) {
    const out = [];
    const add = (scope, item, value, kind, basis) => out.push({ scope, item, value, kind, basis: basis || '' });
    const dd = M.newProject().design;
    add('Project', 'Outdoor design condition', `${data.design.ambientDB} °C / ${data.design.ambientRH} % RH, ${data.design.altitude || 0} m`, (data.design.ambientDB === dd.ambientDB && data.design.ambientRH === dd.ambientRH) ? 'default' : 'user', data.design.climateSource || 'Entered by user');
    add('Project', 'Ground temperature', `${data.design.groundTemp} °C`, data.design.groundTemp === dd.groundTemp ? 'default' : 'user', 'Floor on ground / heated slab');
    add('Method', 'Surface film coefficients', `hᵢ ${D.film.inside}, hₒ ${D.film.outside} (outdoor), ${D.film.adjacent} (adjacent) W/m²K`, 'default', 'Still air inside; wind outside');
    add('Method', 'Product properties', 'Siebel equations from water content; latent heat assumes all water freezes', 'default', 'ASHRAE Thermal Properties of Foods');
    add('Method', 'Heat loss to colder surroundings', data.design.heatLossCredit === 'none' ? 'Not credited (surfaces to colder spaces = 0)' : 'Credited (reduces load)', data.design.heatLossCredit === 'none' ? 'user' : 'default', 'Project option (Gate 3 G3-3)');
    add('Method', 'Occupancy heat', '272 − 6·t W per person', 'default', 'ASHRAE / Dossat');
    for (const r of data.rooms || []) {
      const preset = D.roomTypes[r.type] || {};
      const sc = r.name;
      add(sc, 'Run time', `${r.runHours} h/day`, r.runHours === preset.runHours ? 'default' : 'user', 'Preset for ' + (preset.name || r.type));
      add(sc, 'Evaporator TD', `${r.TD} K`, r.TD === preset.TD ? 'default' : 'user', '');
      add(sc, 'Safety factor', `${r.safety} %`, +r.safety === +(data.design.safetyFactor) ? 'default' : 'user', '');
      add(sc, 'Product load capacity basis', r.productBasis === 'pulldown' ? 'Rate over pull-down: Q/min(t_pull, t_run)' : 'Daily: Q × 24/t_pull ÷ run time', r.productBasis === 'pulldown' ? 'user' : 'default', 'Room option (Gate 3 G3-2)');
      for (const s of r.surfaces || []) {
        if (s.uOverride !== '' && s.uOverride != null) add(sc, `${s.label} U-value`, `${s.uOverride} W/m²K`, 'override', 'U-value override');
        if (s.areaOverride !== '' && s.areaOverride != null) add(sc, `${s.label} area`, `${s.areaOverride} m²`, 'override', 'Area override');
        if (s.adj === 'ambient' && s.sun && s.sun !== 'none') add(sc, `${s.label} sun effect`, `${s.sun} surface`, 'user', 'Sun-effect allowance');
      }
      for (const p of r.products || []) {
        const ref = D.products.find((x) => x.id === p.productId) || {};
        add(sc, `${ref.name || 'Product'} water content`, `${p.xw !== '' && p.xw != null ? p.xw : ref.xw} %`, p.xw !== '' && p.xw != null ? 'override' : 'database', 'Product database (typical)');
        add(sc, `${ref.name || 'Product'} freezing point`, `${p.Tf !== '' && p.Tf != null ? p.Tf : ref.Tf} °C`, p.Tf !== '' && p.Tf != null ? 'override' : 'database', 'Product database (typical)');
        for (const [k, lbl, u] of [['cpA', 'c_p above freezing', 'kJ/kg·K'], ['cpB', 'c_p below freezing', 'kJ/kg·K'], ['hLat', 'latent heat', 'kJ/kg']]) if (+p[k] > 0) add(sc, `${ref.name || 'Product'} ${lbl}`, `${p[k]} ${u}`, 'override', 'Entered product data (replaces Siebel)');
        if (+p.respIn > 0) add(sc, `${ref.name || 'Product'} respiration of intake`, `${p.respIn} W/t`, 'user', 'Incoming produce at mean pull-down temperature');
        if (ref.resp > 0 || +p.resp > 0) add(sc, `${ref.name || 'Product'} respiration`, `${p.resp !== '' && p.resp != null ? p.resp : ref.resp} W/t`, p.resp !== '' && p.resp != null ? 'override' : 'database', 'Product database (typical)');
        const pk = D.packaging[p.packType] || {};
        add(sc, 'Packaging', `${p.packPct} % ${pk.name || ''} (c_p ${pk.cp})`, 'user', '');
      }
      if (r.infMethod === 'airchange') add(sc, 'Infiltration method', `Air change (${(r.airChange || {}).method})`, 'user', '');
      else for (const d of r.doors || []) {
        const prot = D.doorProtection[d.protection] || {};
        add(sc, `${d.name || 'Door'} protection`, d.protection === 'custom' ? `E = ${d.E}` : `${prot.name} (E = ${prot.E})`, d.protection === 'custom' ? 'override' : 'default', 'Door protection effectiveness');
        add(sc, `${d.name || 'Door'} flow factor D_f`, d.Df !== '' && d.Df != null ? String(d.Df) : 'auto (0.8 / 1.1)', d.Df !== '' && d.Df != null ? 'override' : 'default', '');
      }
      const e = r.equipment || {};
      add(sc, 'Evaporator fans', e.fanMode === 'kw' ? `${e.fanKW} kW × ${e.fanHours} h` : `${e.fanPct} % allowance`, e.fanMode === 'kw' ? 'user' : 'default', e.fanMode === 'kw' ? 'Selected equipment' : 'Estimate before coil selection');
      if (+e.defrostKW > 0) add(sc, 'Defrost heat to room', `${e.defrostFrac} %`, 'user', '');
    }
    for (const t of data.tunnels || []) {
      add(t.name, 'Freezing-time basis', t.timeBasis === 'entered' ? `Entered ${t.tDesign} h` : t.timeBasis === 'plank' ? 'Plank equation' : 'Pham method (ASHRAE)', t.timeBasis === 'pham' ? 'default' : 'user', 'Tunnel option');
      add(t.name, 'Surface coefficient / packaging resistance', `${t.hAir} W/m²K / ${t.Rpack} m²K/W`, 'user', 'From air velocity, supplier or ASHRAE data');
      add(t.name, 'Frozen product k / ρ', `${t.product.kF} W/mK / ${t.product.rhoF} kg/m³`, 'user', 'Typical values — verify (ASHRAE Thermal Properties of Foods)');
      if (+t.peak !== 1) add(t.name, 'Load distribution factor', String(t.peak), 'user', 'Non-uniform heat release during batch freezing');
      add(t.name, 'Loss & safety', `${t.lossPct} % (${t.lossMethod === 'factor' ? 'Q × (1 + x)' : 'Q ÷ (1 − x)'})`, t.lossMethod === 'factor' ? 'user' : 'default', 'Workbook method');
      for (const k of ['Tf', 'cpA', 'cpB', 'hLat']) if (t.product[k] !== '' && t.product[k] != null) add(t.name, `Product ${k}`, String(t.product[k]), 'override', 'Entered (replaces library value)');
    }
    for (const a of data.assumptions || []) add(a.scope || 'Project', a.item || 'Engineering note', a.value || '', 'note', a.basis || '');
    return out;
  }

  const api = { explainRoom, explainTunnel, assumptions };
  root.CL = root.CL || {};
  root.CL.explain = api;
  if (typeof module === 'object' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  function csvRows(ctx) {
    const { pr } = computeAll(ctx);
    const head = ['project_id', 'project_no', 'revision', 'room', 'component', 'kwh_per_day', 'room_capacity_kw', 'engine_version'];
    const rev = ctx.revision ? ctx.revision.rev : 'WIP';
    const rows = [head];
    for (const { room: r, res } of pr.rooms) {
      for (const b of res.breakdown) rows.push([ctx.project.id, ctx.project.projectNo, rev, r.name, b.label, +b.kWh.toFixed(3), +res.capacity.toFixed(3), ctx.version.ENGINE_VERSION]);
      rows.push([ctx.project.id, ctx.project.projectNo, rev, r.name, 'Safety allowance', +res.safetyKWh.toFixed(3), +res.capacity.toFixed(3), ctx.version.ENGINE_VERSION]);
    }
    for (const { tunnel: t, res: r } of pr.tunnels || []) {
      for (const b of r.breakdown) rows.push([ctx.project.id, ctx.project.projectNo, rev, t.name, `${b.label} [kW during freezing]`, +b.kW.toFixed(4), +r.capacity.toFixed(3), `${ctx.version.ENGINE_VERSION}+freeze ${r.version}`]);
    }
    return rows;
  }

  };
  const ss = {
    get(k) { try { return root.sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { root.sessionStorage.setItem(k, v); } catch (e) { /* unavailable */ } },
    del(k) { try { root.sessionStorage.removeItem(k); } catch (e) { /* unavailable */ } },

  async function boot() {
    const rootEl = document.getElementById('app');
    rootEl.innerHTML = '';
    rootEl.append(h('div', { class: 'boot' }, icon('snow', 36), h('p', {}, 'Starting ColdLoad Pro…')));
    try {
      try { App.store = await CL.db.IDBAdapter.open(); }
      catch (e) {
        App.store = new CL.db.MemoryAdapter();
        App.storageWarning = `Browser database unavailable (${e.message}). Data will NOT be kept after closing — use Backup to save your work.`;
      }
      CL.plant = (data) => root.HLFreeze.calcPlant(data, CL.productsTab.PRODUCTS);
      const deps = { calc: root.HLCalc, model: root.HLModel, migrate: root.HLMigrate, version: CL.version, plant: CL.plant };
      App.repo = CL.repo.createRepo(App.store, deps);
      App.repo.setUserProvider(() => (App.user ? App.user.displayName || App.user.username : 'system'));
      App.auth = CL.auth.createAuth(App.store);
      App.backup = CL.backup.createBackup(App.store, { version: CL.version, repo: App.repo, migrate: root.HLMigrate });
      await App.repo.init({ seedClimate: CL.climate.seedRecords(), seedReferences: CL.refs.REFERENCES });
      try { if (navigator.storage && navigator.storage.persist) App.persisted = await navigator.storage.persist(); } catch (e) { App.persisted = false; }
      await loadSettings();
      const sid = ls.get(SESSION_KEY) || ss.get(SESSION_KEY);
      const s = sid ? await App.auth.resume(sid) : null;
      if (s) await afterSignIn(s, true);
      else if (!(await App.auth.hasUsers())) renderSetup();
      else renderLogin();
    } catch (e) {
      rootEl.innerHTML = '';
      rootEl.append(h('div', { class: 'boot' }, h('h2', {}, 'ColdLoad Pro could not start'), h('p', {}, e.message), h('pre', { class: 'diag' }, e.stack || '')));
    }
  }

  async function onRoute() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const name = parts[0] || 'dashboard';
    if (App.open && !(name === 'project' && parts[1] === App.open.id)) {
      if (!(await App.closeProject())) { history.replaceState(null, '', `#/project/${App.open.id}/${App.route.params[1] || 'details'}`); return; }
    }
    App.route = { name, params: parts.slice(1) };
    document.querySelectorAll('.side [data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === name));
    const bodyEl = document.querySelector('#app > .body');
    if (bodyEl) bodyEl.classList.toggle('compact', name === 'project');
    const view = document.getElementById('view');
    const fn = App.views[name] || App.views.dashboard;
    try {
      const node = await fn(App.route.params);
      if (App.route.name !== name) return;
      view.replaceChildren(node);
      view.scrollTop = 0;
    } catch (e) {
      view.replaceChildren(h('div', { class: 'page' }, h('h2', {}, 'This page could not be shown'), h('p', {}, e.message)));

  /* ---------- project session ---------- */
  App.projects = async (force) => {
    if (!App.cache.projects || force) App.cache.projects = await App.repo.listProjects({ includeArchived: true, includeDeleted: true });
    return App.cache.projects;
  };

  App.openProject = async (id) => {
    if (App.open && App.open.id === id) return App.open;
    const rec = await App.repo.getProject(id);
    if (!rec || rec.deletedAt) throw new Error('This project does not exist or is in the Trash.');
    App.open = { id, rec, data: JSON.parse(JSON.stringify(rec.working.data)), dirty: false, undo: [], redo: [], savedAt: rec.working.savedAt, snapAt: 0 };
    const recent = [id, ...(((App.user.prefs || {}).recent) || []).filter((x) => x !== id)].slice(0, 10);
    App.auth.updateProfile(App.user.id, { prefs: { recent } }).then((u) => { App.user = u; });
    setupAutosave();
    return App.open;
  };

  /** Resolve: true = closed, false = user cancelled. */
  App.closeProject = async () => {
    const o = App.open;
    if (!o) return true;
    if (o.dirty) {
      const v = await modal({ title: 'Unsaved changes', body: h('p', {}, `“${o.rec.name}” has unsaved changes.`), actions: [
        { label: 'Cancel', value: 'cancel' }, { label: 'Discard changes', value: 'discard', kind: 'danger' }, { label: 'Save', value: 'save', kind: 'primary' }] });
      if (v === 'save') { if (!(await App.save())) return false; }
      else if (v !== 'discard') return false;
    }
    clearInterval(App.autosaveTimer);
    App.open = null; App.pendingMeta = null; updateBar();
    return true;
  };

  function snapshot() { return JSON.stringify(App.open.data); }

  /** Call BEFORE mutating project data is not needed: fields mutate then call changed(). */
  App.changed = (rerender) => {
    const o = App.open; if (!o) return;
    const now = Date.now();
    if (!o.last) o.last = JSON.stringify(o.rec.working.data);
    if (now - o.snapAt > 700) { o.undo.push(o.last); if (o.undo.length > 100) o.undo.shift(); o.redo = []; }
    o.snapAt = now; o.last = snapshot();
    o.dirty = true;
    updateBar();
    if (App.onDataChange) App.onDataChange(rerender);
  };
  App.undo = () => {
    const o = App.open; if (!o || !o.undo.length) return;
    o.redo.push(snapshot()); o.data = JSON.parse(o.undo.pop()); o.last = snapshot(); o.snapAt = 0; o.dirty = true;
    updateBar(); onRoute(); toast('Undone', 'info', 1500);
  };
  App.redo = () => {
    const o = App.open; if (!o || !o.redo.length) return;
    o.undo.push(snapshot()); o.data = JSON.parse(o.redo.pop()); o.last = snapshot(); o.snapAt = 0; o.dirty = true;
    updateBar(); onRoute(); toast('Redone', 'info', 1500);
  };

  App.save = async () => {
    const o = App.open; if (!o || !o.dirty) return true;
    o.saving = true; updateBar();
    try {
      o.rec = await App.repo.saveWorking(o.id, o.data, App.pendingMeta ? App.pendingMeta : undefined);
      App.pendingMeta = null;
      o.dirty = false; o.savedAt = o.rec.working.savedAt; o.last = snapshot();
      App.cache.projects = null;
      return true;
    } catch (e) { errorDlg('Saving the project', e, 'Your changes are still on screen. Create a Backup of the database and try again.'); return false; }
    finally { o.saving = false; updateBar(); }
  };

  function setupAutosave() {
    clearInterval(App.autosaveTimer);
    const sec = +((App.user.prefs || {}).autosaveSec ?? App.settings.general.autosaveSec) || 0;
    if (sec > 0) App.autosaveTimer = setInterval(() => { if (App.open && App.open.dirty && !App.open.saving) App.save(); }, sec * 1000);
  }
  App.setupAutosave = setupAutosave;

  /* ---------- keyboard ---------- */
  function globalKeys(e) {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); App.save(); }
    else if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('gsearch').focus(); }
    else if (mod && e.key.toLowerCase() === 'p' && App.open) { e.preventDefault(); CL.projectActions.print(); }
    else if (mod && e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); CL.projectActions.newProject(); }
    else if (e.key === 'F1') { e.preventDefault(); CL.guidePanel.toggle(); }
    else if (mod && !e.shiftKey && e.key.toLowerCase() === 'z' && !isTextTarget(e)) { e.preventDefault(); App.undo(); }
    else if (mod && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) && !isTextTarget(e)) { e.preventDefault(); App.redo(); }
  }
  const isTextTarget = (e) => /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox';

  /* ---------- global search ---------- */
  let hits = [], hitIx = 0;
  async function showSearch(q) {
    const box = document.getElementById('gresults');
    q = q.trim().toLowerCase();
    if (!q) { hideSearch(); return; }
    const [projects, customers] = await Promise.all([App.projects(), App.repo.listCustomers()]);
    const cmap = Object.fromEntries(customers.map((c) => [c.id, c.name]));
    const terms = q.split(/\s+/);
    const score = (hay) => terms.every((t) => hay.includes(t));
    hits = [];
    for (const p of projects) {
      const hay = [p.projectNo, p.name, cmap[p.customerId], p.site, p.city, p.country, p.createdBy, p.modifiedBy, p.status, p.type, p.notes, p.endUser, p.consultant, p.contractor, ...(p.working.data.rooms || []).map((r) => r.name)].join(' ').toLowerCase();
      if (score(hay)) hits.push({ kind: p.deletedAt ? 'Trash' : 'Project', title: `${p.projectNo} · ${p.name}`, sub: [cmap[p.customerId], p.site, p.status].filter(Boolean).join(' · '), go: p.deletedAt ? 'documents/trash' : `project/${p.id}/details` });
    }
    for (const c of customers) if (score([c.name, c.address, c.contact, c.email].join(' ').toLowerCase())) hits.push({ kind: 'Customer', title: c.name, sub: c.address || '', go: `customers/${c.id}` });
    hits = hits.slice(0, 12); hitIx = 0;
    box.hidden = false;
    box.replaceChildren(...(hits.length ? hits.map((x, i) => h('button', { type: 'button', class: 'ghit' + (i === 0 ? ' sel' : ''), onmousedown: (e) => { e.preventDefault(); pick(i); } },
      h('span', { class: 'gkind' }, x.kind), h('span', {}, h('b', {}, x.title), h('small', {}, x.sub)))) : [h('p', { class: 'muted pad' }, 'No matches.')]));
  }
  function pick(i) { const x = hits[i]; if (!x) return; hideSearch(); document.getElementById('gsearch').value = ''; App.go(x.go); }
  function hideSearch() { const b = document.getElementById('gresults'); if (b) b.hidden = true; }
  function searchKeys(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); hitIx = (hitIx + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(1, hits.length);
      document.querySelectorAll('.ghit').forEach((b, i) => b.classList.toggle('sel', i === hitIx));
    } else if (e.key === 'Enter') { e.preventDefault(); pick(hitIx); } else if (e.key === 'Escape') { hideSearch(); e.target.blur(); }
  }

  /* ---------- global error handling ---------- */
  root.addEventListener('unhandledrejection', (e) => { e.preventDefault(); errorDlg('The last action', e.reason, 'Try again. If it keeps happening, create a backup and reload the application.'); });
  root.addEventListener('error', (e) => { if (e.error) errorDlg('The last action', e.error, 'Reload the application. Your saved data is not affected.'); });

  App.boot = boot;
  App.esc = esc;
})(globalThis);
